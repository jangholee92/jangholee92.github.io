# ---------------------------------------------------------
# BASIC SITE SETTINGS
# ---------------------------------------------------------
locale: "en-US"
site_theme: "default"
title: "Jangho Lee"
title_separator: "-"
name: &name "Jangho Lee, Ph.D"
description: &description "Personal description"
url: "https://jangholee92.github.io"  # base hostname & protocol
baseurl: ""  # no subpath since this is a user site
repository: "jangholee92/jangholee92.github.io"  # updated to reflect your GitHub repo

# ---------------------------------------------------------
# AUTHOR PROFILE
# ---------------------------------------------------------
author:
  avatar: "profile.png"
  name: "Jangho Lee"
  bio: "CROCUS Postdoctoral Researcher"
  location: "Chicago, IL"
  employer: "University of Illinois Chicago"
  email: "jholee@uic.edu"
  # Academic websites
  googlescholar: "https://scholar.google.com/citations?user=wBEE2YAAAAAJ&hl=en&authuser=1"
  orcid: "https://orcid.org/0000-0002-8942-1092"
  researchgate: "https://www.researchgate.net/profile/Jangho-Lee-5?ev=hdr_xprf"
  # Code repositories
  github: "jangholee92"

# ---------------------------------------------------------
# PUBLICATION CATEGORY (If you need dynamic publication pages)
# ---------------------------------------------------------
publication_category:
  manuscripts:
    title: "Peer-Reviewed Journal Articles"

# ---------------------------------------------------------
# SITE SETTINGS
# ---------------------------------------------------------
teaser:        # e.g., "500x300.png" if you have a default teaser image
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider:     # e.g., "disqus"
  disqus:
    shortname:
  discourse:
    server:
  facebook:
    appid:
    num_posts:
    colorscheme:

staticman:
  allowedFields: ['name', 'email', 'url', 'message']
  branch: "gh-pages"
  commitMessage: "New comment."
  filename: "comment-{@timestamp}"
  format: "yml"
  moderation: true
  path: "_data/comments/{options.slug}"
  requiredFields: ['name', 'email', 'message']
  transforms:
    email: "md5"
  generatedFields:
    date:
      type: "date"
      options:
        format: "iso8601"

atom_feed:
  hide: false
  path:      # leave blank to default to feed.xml

# ---------------------------------------------------------
# SEO / VERIFICATIONS
# ---------------------------------------------------------
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

# ---------------------------------------------------------
# SOCIAL SHARING
# ---------------------------------------------------------
twitter:
  username: &twitter
facebook:
  username:
  app_id:
  publisher:
og_image:      # default Open Graph image

social:
  type:        # Person or Organization
  name:
  links:       # array of links to social media profiles

# ---------------------------------------------------------
# ANALYTICS
# ---------------------------------------------------------
analytics:
  provider: "false"  # e.g., "google" or "google-analytics-4"
  google:
    tracking_id:

# ---------------------------------------------------------
# READING FILES
# ---------------------------------------------------------
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ---------------------------------------------------------
# CONVERSION / MARKDOWN
# ---------------------------------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ---------------------------------------------------------
# COLLECTIONS
# ---------------------------------------------------------
collections:
  teaching:
    output: false
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: false
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# ---------------------------------------------------------
# DEFAULTS (LAYOUTS FOR CONTENT)
# ---------------------------------------------------------
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true

  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# ---------------------------------------------------------
# SASS/SCSS
# ---------------------------------------------------------
sass:
  sass_dir: _sass
  style: compressed

# ---------------------------------------------------------
# OUTPUT / PERMALINKS
# ---------------------------------------------------------
permalink: /:categories/:title/
# paginate: 5
# paginate_path: /page:num/
timezone: Etc/UTC

# ---------------------------------------------------------
# PLUGINS
# ---------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# ---------------------------------------------------------
# ARCHIVES
# ---------------------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/

# ---------------------------------------------------------
# HTML COMPRESSION
# ---------------------------------------------------------
compress_html:
  clippings: all
  ignore:
    envs: development
